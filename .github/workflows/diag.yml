name: 诊断船舶查询
on:
  workflow_dispatch:
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: python diag_ship.py
        env:
          NPEDI_TOKEN: ${{ secrets.NPEDI_TOKEN }}
